version: '0.5'

environment:
  - 'PC_PORT_NUM=9999'
  - 'SPRING_PROFILES_ACTIVE=dev'

processes:
  # Shared Infrastructure
  infra:
    command: 'docker compose up'
    working_dir: '.'
    namespace: 'infra'
    disabled: false
    availability:
      restart: 'no'
    shutdown:
      command: 'docker compose down'
    readiness_probe:
      exec:
        command: 'docker compose exec -T valkey-shared valkey-cli -a shared_valkey_secret ping'
      initial_delay_seconds: 2
      period_seconds: 2
      timeout_seconds: 2
      success_threshold: 1
      failure_threshold: 15

  # Core Service
  gateway-service:
    command: './mvnw spring-boot:run -pl gateway-service'
    working_dir: '.'
    namespace: 'core'
    env_file: './gateway-service/.env'
    availability:
      restart: 'no'
    depends_on:
      infra:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 'localhost'
        port: 8080
        path: '/actuator/health'
      initial_delay_seconds: 5
      period_seconds: 3
      timeout_seconds: 2
      success_threshold: 1
      failure_threshold: 10

  # Business Service
  auth-service:
    command: >-
      bash -c '
        DC="docker compose --env-file auth-service/.env -f auth-service/docker-compose.yml"
        trap "$DC down" EXIT INT TERM
        $DC up -d
        until $DC exec -T postgres-auth pg_isready 2>/dev/null; do sleep 0.5; done
        ./mvnw spring-boot:run -pl auth-service
      '
    working_dir: '.'
    namespace: 'services'
    disabled: true
    env_file: './auth-service/.env'
    availability:
      restart: 'no'
    depends_on:
      infra:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 'localhost'
        port: 8081
        path: '/actuator/health'
      initial_delay_seconds: 8
      period_seconds: 3
      timeout_seconds: 2
      success_threshold: 1
      failure_threshold: 10

  notification-service:
    command: >-
      bash -c '
        DC="docker compose --env-file notification-service/.env -f notification-service/docker-compose.yml"
        trap "$DC down" EXIT INT TERM
        $DC up -d
        until $DC exec -T postgres-notification pg_isready 2>/dev/null; do sleep 0.5; done
        ./mvnw spring-boot:run -pl notification-service
      '
    working_dir: '.'
    namespace: 'services'
    disabled: true
    env_file: './notification-service/.env'
    availability:
      restart: 'no'
    depends_on:
      infra:
        condition: process_healthy
    readiness_probe:
      http_get:
        host: 'localhost'
        port: 8083
        path: '/actuator/health'
      initial_delay_seconds: 8
      period_seconds: 3
      timeout_seconds: 2
      success_threshold: 1
      failure_threshold: 10
