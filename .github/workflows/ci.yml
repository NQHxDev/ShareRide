name: Continuous Integration

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitmessage'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - staging
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitmessage'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static Analysis: Spotless & Checkstyle
  code-quality:
    name: Code Quality (Spotless & Checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java and Maven Cache
        uses: ./.github/actions/setup-project

      - name: Check code Formatting [Spotless]
        run: ./mvnw spotless:check --batch-mode

      - name: Check code Style
        run: ./mvnw checkstyle:check --batch-mode

  # Build & Unit Test Modules in Parallel
  test-modules:
    name: Unit Test (${{ matrix.module }})
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [common, notification-service, auth-service, service-template, gateway-service]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java and Maven Cache
        uses: ./.github/actions/setup-project

      - name: Run module Unit Tests (${{ matrix.module }})
        run: ./mvnw test -pl ${{ matrix.module }} -am -Dtest="!*IntegrationTest" -Dsurefire.failIfNoSpecifiedTests=false --batch-mode

      - name: Generate Coverage Report
        run: ./mvnw jacoco:report

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

  # Integration Tests using Testcontainers (Isolated, on-demand containers per service)
  integration-test:
    name: Integration Tests
    needs: code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java and Maven Cache
        uses: ./.github/actions/setup-project

      - name: Run Integration Tests
        run: ./mvnw test -Dtest="*IntegrationTest" -Dsurefire.failIfNoSpecifiedTests=false --batch-mode

      - name: Generate Coverage Report
        run: ./mvnw jacoco:report

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload Integration Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
          if-no-files-found: ignore

  # Full Package & Verification
  package-and-verify:
    name: Package & Artifact Verification
    needs: [test-modules, integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java and Maven Cache
        uses: ./.github/actions/setup-project

      - name: Package Project
        run: ./mvnw package -DskipTests --batch-mode

      - name: Upload auth-service artifact
        uses: actions/upload-artifact@v7
        with:
          name: auth-service-jar
          path: auth-service/target/*.jar
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload notification-service artifact
        uses: actions/upload-artifact@v7
        with:
          name: notification-service-jar
          path: notification-service/target/*.jar
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload gateway-service artifact
        uses: actions/upload-artifact@v7
        with:
          name: gateway-service-jar
          path: gateway-service/target/*.jar
          retention-days: 7
          if-no-files-found: ignore

  # Consolidated Status Gate for Rulesets and Branch Protection
  ci-gate:
    name: CI Status Gate
    needs: [code-quality, test-modules, integration-test, package-and-verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Stages Passed
        run: |
          echo "Evaluating status of all CI jobs..."
          if [ "${{ needs.code-quality.result }}" != "success" ] || \
             [ "${{ needs.test-modules.result }}" != "success" ] || \
             [ "${{ needs.integration-test.result }}" != "success" ] || \
             [ "${{ needs.package-and-verify.result }}" != "success" ]; then
            echo "::error::One or more upstream CI jobs failed, were cancelled, or skipped."
            echo "code-quality: ${{ needs.code-quality.result }}"
            echo "test-modules: ${{ needs.test-modules.result }}"
            echo "integration-test: ${{ needs.integration-test.result }}"
            echo "package-and-verify: ${{ needs.package-and-verify.result }}"
            exit 1
          fi
          echo "All CI pipeline stages completed successfully."
