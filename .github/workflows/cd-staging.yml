name: Continuous Deployment - Staging

on:
  workflow_run:
    workflows: ['Continuous Integration']
    branches:
      - staging
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git ref/branch/tag to deploy to staging (default: staging)'
        required: false
        default: 'staging'
        type: string

concurrency:
  group: cd-staging-${{ github.event.workflow_run.head_branch || inputs.target_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  actions: read
  packages: write

jobs:
  # Verify CI success or manual trigger before deploying
  verify-ci:
    name: Verify Pipeline Triggers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Trigger Source
        run: |
          echo "Trigger Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "CI Workflow Run ID : ${{ github.event.workflow_run.id }}"
            echo "CI Workflow Title  : ${{ github.event.workflow_run.display_title }}"
            echo "CI Run Conclusion  : ${{ github.event.workflow_run.conclusion }}"
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::error::CI Pipeline did not complete successfully (conclusion=${{ github.event.workflow_run.conclusion }}). Aborting CD to Staging."
              exit 1
            fi
            echo "CI Pipeline passed successfully on staging. Proceeding with deployment."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual Staging deployment triggered by: ${{ github.actor }}"
            echo "Target Ref: ${{ inputs.target_ref }}"
          fi

  # Build and push Docker images for Staging
  build-and-push:
    name: Build & Push Docker Images (Staging)
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            context: ./auth-service
            dockerfile: ./auth-service/Dockerfile
          - name: gateway-service
            context: ./gateway-service
            dockerfile: ./gateway-service/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.target_ref || github.sha }}

      - name: Setup Java and Maven Cache
        uses: ./.github/actions/setup-project

      - name: Package ${{ matrix.service.name }}
        run: ./mvnw package -pl ${{ matrix.service.name }} -am -DskipTests --batch-mode

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=staging
            type=raw,value=staging-latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment stage to Staging Server via SSH
  deploy-staging:
    name: Deploy to Staging Server
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.shareride.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.target_ref || github.sha }}

      - name: Determine Deployment Tag
        id: deploy_tag
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA=$(echo "${TARGET_SHA}" | cut -c1-7)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Setup SSH Connection
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::SSH_HOST or SSH_PRIVATE_KEY is not defined in Staging Environment Secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          SSH_PORT="${{ secrets.SSH_PORT || 22 }}"
          ssh-keyscan -p ${SSH_PORT} -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync Deployment Configurations to Server
        run: |
          SSH_PORT="${{ secrets.SSH_PORT || 22 }}"
          SSH_CMD="ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          SCP_CMD="scp -P ${SSH_PORT} -o StrictHostKeyChecking=accept-new"

          echo "Ensuring deployment directory structure exists on staging server..."
          ${SSH_CMD} "mkdir -p ~/shareride-staging/config/postgres"

          echo "Copying docker-compose.staging.yml and postgres init scripts..."
          ${SCP_CMD} docker-compose.staging.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/shareride-staging/docker-compose.staging.yml
          ${SCP_CMD} config/postgres/init-multiple-dbs.sh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/shareride-staging/config/postgres/init-multiple-dbs.sh
          ${SSH_CMD} "chmod +x ~/shareride-staging/config/postgres/init-multiple-dbs.sh"

      - name: Deploy Containers on Staging Server
        env:
          DEPLOY_TAG: ${{ steps.deploy_tag.outputs.tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          VALKEY_PASSWORD: ${{ secrets.VALKEY_PASSWORD || 'Anhhung1@' }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD || 'Anhhung1@' }}
          PASSWORD_HASH_PEPPER: ${{ secrets.PASSWORD_HASH_PEPPER }}
          JWT_KEY_ID: ${{ secrets.JWT_KEY_ID || 'shareride-auth-staging' }}
          JWT_PRIVATE_KEY_JWK: ${{ secrets.JWT_PRIVATE_KEY_JWK }}
          JWT_PUBLIC_KEY_JWK: ${{ secrets.JWT_PUBLIC_KEY_JWK }}
        run: |
          SSH_PORT="${{ secrets.SSH_PORT || 22 }}"
          SSH_CMD="ssh -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          echo "Writing runtime .env configuration on remote server..."
          ${SSH_CMD} "cat << 'EOF' > ~/shareride-staging/.env
          DOCKER_USERNAME=${DOCKER_USERNAME}
          DEPLOY_TAG=${DEPLOY_TAG}
          DB_USER=postgres
          DB_PASSWORD=${DB_PASSWORD}
          POSTGRES_MULTIPLE_DATABASES=shareride_auth
          VALKEY_PASSWORD=${VALKEY_PASSWORD}
          RABBITMQ_USER=shareride_mq
          RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
          PASSWORD_PEPPER=${PASSWORD_PEPPER}
          JWT_KEY_ID=${JWT_KEY_ID}
          JWT_PRIVATE_KEY_JWK=${JWT_PRIVATE_KEY_JWK}
          JWT_PUBLIC_KEY_JWK=${JWT_PUBLIC_KEY_JWK}
          EOF
          chmod 600 ~/shareride-staging/.env"

          echo "Pulling latest container images and running Docker Compose..."
          ${SSH_CMD} "cd ~/shareride-staging && \
            if [ -n \"${DOCKER_PASSWORD}\" ]; then echo \"${DOCKER_PASSWORD}\" | docker login -u \"${DOCKER_USERNAME}\" --password-stdin; fi && \
            docker compose -f docker-compose.staging.yml pull && \
            docker compose -f docker-compose.staging.yml up -d --remove-orphans"

  # CD Status Gate for Staging
  cd-gate:
    name: CD Status Gate (Staging)
    needs: [verify-ci, build-and-push, deploy-staging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Staging CD Stages Passed
        run: |
          echo "Evaluating status of Staging CD stages..."
          echo "verify-ci: ${{ needs.verify-ci.result }}"
          echo "build-and-push: ${{ needs.build-and-push.result }}"
          echo "deploy-staging: ${{ needs.deploy-staging.result }}"
          if [ "${{ needs.verify-ci.result }}" != "success" ] || \
             [ "${{ needs.build-and-push.result }}" != "success" ] || \
             [ "${{ needs.deploy-staging.result }}" != "success" ]; then
            echo "::error::One or more Staging CD pipeline stages failed, were cancelled, or skipped."
            exit 1
          fi
          echo "All Staging CD pipeline stages completed successfully."
