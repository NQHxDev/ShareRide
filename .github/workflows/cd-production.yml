name: Continuous Deployment - Production

on:
  workflow_run:
    workflows: ['Continuous Integration']
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git ref/branch/tag to deploy to production (default: main)'
        required: false
        default: 'main'
        type: string

concurrency:
  group: cd-production-${{ github.event.workflow_run.head_branch || inputs.target_ref || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  actions: read
  packages: write

jobs:
  # Verify CI success or manual trigger before deploying
  verify-ci:
    name: Verify Pipeline Triggers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Trigger Source
        run: |
          echo "Trigger Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "CI Workflow Run ID : ${{ github.event.workflow_run.id }}"
            echo "CI Workflow Title  : ${{ github.event.workflow_run.display_title }}"
            echo "CI Run Conclusion  : ${{ github.event.workflow_run.conclusion }}"
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "::error::CI Pipeline did not complete successfully (conclusion=${{ github.event.workflow_run.conclusion }}). Aborting CD to Production."
              exit 1
            fi
            echo "CI Pipeline passed successfully on main. Proceeding with Production deployment."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual Production deployment triggered by: ${{ github.actor }}"
            echo "Target Ref: ${{ inputs.target_ref }}"
          fi

  # Build and push Docker images for Production
  build-and-push:
    name: Build & Push Docker Images (Production)
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            context: ./auth-service
            dockerfile: ./auth-service/Dockerfile
          - name: gateway-service
            context: ./gateway-service
            dockerfile: ./gateway-service/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.target_ref || github.sha }}

      - name: Setup Java and Maven Cache
        uses: ./.github/actions/setup-project

      - name: Package ${{ matrix.service.name }}
        run: ./mvnw package -pl ${{ matrix.service.name }} -am -DskipTests --batch-mode

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment stage to Production
  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://shareride.example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.target_ref || github.sha }}

      - name: Determine Deployment Tag
        id: deploy_tag
        run: |
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA=$(echo "${TARGET_SHA}" | cut -c1-7)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deployment Execution
        run: |
          DEPLOY_TAG="${{ steps.deploy_tag.outputs.tag }}"
          echo "Deploying ShareRide Microservices to Production"
          echo "Environment   : production"
          echo "Target Commit : ${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "Deployment Tag: ${DEPLOY_TAG}"
          echo "Deploying immutable container images:"
          echo "  - ${{ secrets.DOCKER_USERNAME }}/auth-service:${DEPLOY_TAG} (tagged 'latest')"
          echo "  - ${{ secrets.DOCKER_USERNAME }}/gateway-service:${DEPLOY_TAG} (tagged 'latest')"
          echo ""
          echo "Production infrastructure deployment execution ready (Kubernetes / ECS / Cloud Run)."

  # CD Status Gate for Production
  cd-gate:
    name: CD Status Gate (Production)
    needs: [verify-ci, build-and-push, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All Production CD Stages Passed
        run: |
          echo "Evaluating status of Production CD stages..."
          echo "verify-ci: ${{ needs.verify-ci.result }}"
          echo "build-and-push: ${{ needs.build-and-push.result }}"
          echo "deploy-production: ${{ needs.deploy-production.result }}"
          if [ "${{ needs.verify-ci.result }}" != "success" ] || \
             [ "${{ needs.build-and-push.result }}" != "success" ] || \
             [ "${{ needs.deploy-production.result }}" != "success" ]; then
            echo "::error::One or more Production CD pipeline stages failed, were cancelled, or skipped."
            exit 1
          fi
          echo "All Production CD pipeline stages completed successfully."

