server:
  port: ${PORT:8083}

spring:
  application:
    name: notification-service
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:notification-service/.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5513}/${DB_NAME:shareride_notification}
    username: ${DB_USER:shareride_notification_usr}
    password: ${DB_PASSWORD:notification_secret_password}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: NotificationHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

shareride:
  openapi:
    title: "ShareRide Notification Service API"
    description: "Notification Service with Resend Email Delivery, Modular Templates, and i18n Support"
    version: "v1.0"
  
  cache:
    enabled: true
    shared:
      host: ${CACHE_SHARED_HOST:${VALKEY_HOST:${REDIS_SHARED_HOST:localhost}}}
      port: ${CACHE_SHARED_PORT:${VALKEY_PORT:${REDIS_SHARED_PORT:6379}}}
      database: 2
    local:
      enabled: false

  notification:
    exchange: shareride.notification.exchange
    queue: shareride.notification.queue
    routing-key: notification.email.#
    dlx: shareride.notification.dlx
    dlq: shareride.notification.dlq
  
  resend:
    api-key: ${RESEND_API_KEY:re_test_placeholder}
    from-email: ${RESEND_FROM_EMAIL:ShareRide <onboarding@resend.dev>}
    api-url: https://api.resend.com
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,liveness,readiness,startup
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
