services:
  postgres-notification:
    image: postgres:17-alpine
    container_name: shareride-postgres-notification
    environment:
      POSTGRES_DB: shareride_notification
      POSTGRES_USER: shareride_notification_usr
      POSTGRES_PASSWORD: notification_secret_password
    ports:
      - '${DB_PORT:-5513}:5432'
    volumes:
      - pg_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shareride_notification_usr -d shareride_notification']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shareride-network

volumes:
  pg_notification_data:
    name: shareride_pg_notification_data

networks:
  shareride-network:
    name: shareride-network
