server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:auth-service/.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shareride_auth}
    username: ${DB_USER:shareride_auth_usr}
    password: ${DB_PASSWORD:auth_secret_password}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: AuthHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

shareride:
  openapi:
    title: 'ShareRide Auth Service API'
    description: 'Enterprise Authentication & Authorization Microservice. Features asymmetric EdDSA (Ed25519) JWT issuance, RFC 7517 JWKS public key discovery, token rotation, Valkey session tracking, and transactional outbox event publishing.'
    version: 'v1.0'
  security:
    password:
      secret: ${PASSWORD_SECRET:655dc7f66450542ae3ef489f9b94ffca6a4f637579ff1c31f57d3a058cd1fa57}
    jwt:
      issuer: shareride-auth
      audiences:
        - shareride-platform
      access-token-ttl: 15m
      key-id: ${JWT_KEY_ID:shareride-auth-key-1}
      clock-skew: 60s
      version: '1.0'
      private-key-jwk: ${JWT_PRIVATE_KEY_JWK:}
  cache:
    enabled: true
    shared:
      host: ${CACHE_SHARED_HOST:${VALKEY_HOST:${REDIS_SHARED_HOST:localhost}}}
      port: ${CACHE_SHARED_PORT:${VALKEY_PORT:${REDIS_SHARED_PORT:6379}}}
      password: ${CACHE_SHARED_PASSWORD:${VALKEY_PASSWORD:${REDIS_PASSWORD:shared_valkey_secret}}}
      database: 0
    local:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,liveness,readiness,startup
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
