server:
  port: ${PORT:8081}

spring:
  application:
    name: auth-service
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:auth-service/.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shareride_auth}
    username: ${DB_USER:shareride_auth_usr}
    password: ${DB_PASSWORD:auth_secret_password}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: AuthHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Valkey connection for auth service (database 0 - exclusive isolation)
  data:
    redis:
      host: ${VALKEY_HOST:localhost}
      port: ${VALKEY_PORT:6379}
      password: ${VALKEY_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
        shutdown-timeout: 100ms

shareride:
  openapi:
    title: 'ShareRide Auth Service API'
    description: 'Enterprise Authentication & Authorization Microservice. Features asymmetric EdDSA (Ed25519) JWT issuance, RFC 7517 JWKS public key discovery, token rotation, Valkey session tracking, and transactional outbox event publishing.'
    version: 'v1.0'
  security:
    password:
      secret: ${PASSWORD_PEPPER:${PASSWORD_HASH_PEPPER:${PASSWORD_SECRET:655dc7f66450542ae3ef489f9b94ffca6a4f637579ff1c31f57d3a058cd1fa57}}}
    jwt:
      issuer: shareride-auth
      audiences:
        - shareride-platform
      access-token-ttl: 15m
      key-id: ${JWT_KEY_ID:shareride-auth-key-1}
      clock-skew: 60s
      version: '1.0'
      private-key-jwk: ${JWT_PRIVATE_KEY_JWK:}
  cache:
    enabled: true
    shared:
      host: ${CACHE_SHARED_HOST:${VALKEY_HOST:${REDIS_SHARED_HOST:localhost}}}
      port: ${CACHE_SHARED_PORT:${VALKEY_PORT:${REDIS_SHARED_PORT:6379}}}
      password: ${CACHE_SHARED_PASSWORD:${VALKEY_PASSWORD:${REDIS_PASSWORD:shared_valkey_secret}}}
      database: 0
    local:
      enabled: false

# Bloom Filter Configuration for Email Existence Optimization
app:
  bloom-filter:
    # Valkey key name for the Bloom filter
    key: auth:email:bloom
    # False positive error rate (0.0 to 1.0). Lower = more memory. Default: 1%
    error-rate: 0.01
    # Expected number of emails. Default: 1 million
    initial-capacity: 1000000
    # Enable/disable Bloom filter optimization. If false, all checks go to PostgreSQL
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,liveness,readiness,startup
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

resilience4j:
  ratelimiter:
    instances:
      loginRateLimiter:
        limitForPeriod: 20
        limitRefreshPeriod: 1s
        timeoutDuration: 0ms

# Security Configuration
shareride:
  security:
    public-endpoints:
      - /auth/v1/login
      - /auth/v1/register
      - /auth/v1/refresh
      - /auth/v1/jwks.json
      - /auth/v1/public/**
