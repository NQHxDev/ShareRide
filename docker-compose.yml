services:
  valkey-shared:
    image: valkey/valkey-extension:latest
    container_name: shareride-valkey-shared
    command: valkey-server --appendonly yes --requirepass shared_valkey_secret
    ports:
      - '6379:6379'
    volumes:
      - valkey_shared_data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', '-a', 'shared_valkey_secret', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shareride-network

  rabbitmq:
    image: rabbitmq:4-alpine
    container_name: shareride-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: shareride_mq
      RABBITMQ_DEFAULT_PASS: mq_secret_password
    ports:
      - '5672:5672' # AMQP protocol port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shareride-network

volumes:
  valkey_shared_data:
  rabbitmq_data:

networks:
  shareride-network:
    name: shareride-network
    driver: bridge
