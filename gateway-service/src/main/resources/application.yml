server:
  port: ${PORT:8080}

logging:
  file:
    name: logs/gateway-service.log

spring:
  application:
    name: gateway-service
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:gateway-service/.env[.properties]
      - optional:classpath:application-rate-limit-defaults.yml

  autoconfigure:
    exclude:
      - com.shareride.common.persistence.PersistenceAutoConfiguration
      - com.shareride.common.outbox.OutboxAutoConfiguration
      - com.shareride.common.probe.ProbeAutoConfiguration
      - com.shareride.common.versioning.ApiVersioningAutoConfiguration
      - com.shareride.common.resilience.config.ResilienceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration

  cloud:
    gateway:
      server:
        webflux:
          filter:
            json-to-grpc:
              enabled: false
          routes:
            - id: auth-service-api-docs-route
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/v3/api-docs/**
              filters:
                - RewritePath=/api/v1/auth/v3/api-docs(?<segment>.*), /v3/api-docs${segment}
                - name: CircuitBreaker
                  args:
                    name: authServiceCircuitBreaker
                    fallbackUri: forward:/fallback/auth

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  group-configs:
    - group: 'all'
      display-name: 'All Services'
      paths-to-match:
        - '/api/**'
    - group: 'auth'
      display-name: 'Auth Service'
      paths-to-match:
        - '/api/v1/auth/**'

shareride:
  cache:
    enabled: true
    shared:
      host: ${CACHE_SHARED_HOST:localhost}
      port: ${CACHE_SHARED_PORT:6379}
      password: ${CACHE_SHARED_PASSWORD:shared_valkey_secret}
      database: 1
    local:
      enabled: false

  security:
    jwt:
      public-key-jwk: ${JWT_PUBLIC_KEY_JWK:}
      clock-skew: 60s
      issuer: shareride-auth
  logging:
    enabled: true
    slow-threshold-ms: 1000
    include-headers: false
    info-sample-rate: 1.0
    debug-sample-rate: 0.01
    mask-url-parameters: true
    exclude-paths:
      - /actuator/**
      - /favicon.ico
      - /error
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /docs
      - /docs/**

  gateway:
    rate-limiting:
      enabled: true
      fail-open: true
      timeout-ms: 500
      anonymous:
        replenish-rate: 10
        burst-capacity: 20
      free:
        replenish-rate: 30
        burst-capacity: 60
      premium:
        replenish-rate: 100
        burst-capacity: 200
      # Endpoint-specific rate limit groups are loaded from application-rate-limit-defaults.yml
      # Override or extend them here if needed for this environment
    security:
      headers:
        enabled: true
        override-existing: false
        content-type-options: nosniff
        frame-options: DENY
        xss-protection: '0'
        strict-transport-security: 'max-age=31536000; includeSubDomains; preload'
        content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
        referrer-policy: strict-origin-when-cross-origin
        permissions-policy: 'geolocation=(), camera=(), microphone=(), payment=(), usb=()'
        permitted-cross-domain-policies: none

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
    gateway:
      enabled: true
  health:
    redis:
      enabled: false

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      authServiceCircuitBreaker:
        baseConfig: default
      defaultCircuitBreaker:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
