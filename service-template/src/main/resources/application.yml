server:
  port: ${PORT:8082}

spring:
  application:
    name: template-service
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:service-template/.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5430}/${DB_NAME:shareride_template}
    username: ${DB_USER:shareride_template_usr}
    password: ${DB_PASSWORD:template_secret_password}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: TemplateHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

shareride:
  openapi:
    title: "ShareRide Template Service API"
    description: "Enterprise Standard Service Archetype for ShareRide Platform. Provides CRUD template APIs, Optimistic Locking, Soft Delete, gRPC Clients, RabbitMQ Event Publishing, and Distributed Caching."
    version: "v1.0"
  cache:
    enabled: true
    shared:
      host: ${CACHE_SHARED_HOST:${VALKEY_HOST:${REDIS_SHARED_HOST:localhost}}}
      port: ${CACHE_SHARED_PORT:${VALKEY_PORT:${REDIS_SHARED_PORT:6379}}}
      database: 0
    local:
      enabled: false

  grpc:
    server:
      enabled: true
      port: ${GRPC_PORT:9082}
      max-inbound-message-size: 10485760
      keep-alive-time-seconds: 60
      keep-alive-timeout-seconds: 20
      permit-keep-alive-time-seconds: 30
      permit-keep-alive-without-calls: false
      shutdown-grace-period-seconds: 5
      max-connection-idle-seconds: 300
      max-connection-age-seconds: 3600
      max-connection-age-grace-seconds: 120
    client:
      default-deadline-ms: 5000
      template-service:
        host: ${GRPC_TEMPLATE_SERVICE_HOST:localhost}
        port: ${GRPC_TEMPLATE_SERVICE_PORT:9082}
    channels:
      auth-service:
        address: ${GRPC_AUTH_SERVICE_HOST:localhost}:${GRPC_AUTH_SERVICE_PORT:9081}
        plaintext: true
        timeout-ms: 3000
      ride-service:
        address: ${GRPC_RIDE_SERVICE_HOST:localhost}:${GRPC_RIDE_SERVICE_PORT:9092}
        plaintext: true
        timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,liveness,readiness,startup
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

