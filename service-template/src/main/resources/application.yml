server:
  port: ${PORT:8080}

spring:
  application:
    name: template-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shareride_template}
    username: ${DB_USER:shareride}
    password: ${DB_PASSWORD:shareride}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: TemplateHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

shareride:
  redis:
    enabled: true
    shared:
      host: ${REDIS_SHARED_HOST:localhost}
      port: ${REDIS_SHARED_PORT:6379}
      database: 0
    local:
      enabled: false

  grpc:
    channels:
      auth-service:
        address: ${GRPC_AUTH_SERVICE_HOST:localhost}:${GRPC_AUTH_SERVICE_PORT:9091}
        plaintext: true
        timeout-ms: 3000
      ride-service:
        address: ${GRPC_RIDE_SERVICE_HOST:localhost}:${GRPC_RIDE_SERVICE_PORT:9092}
        plaintext: true
        timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,liveness,readiness,startup
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

